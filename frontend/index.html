<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IIT Madras Placement Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ppa-primary: #1a365d;
        --ppa-accent: #2b6cb0;
        --ppa-surface: #f7fafc;
        --ppa-card-shadow: 0 4px 14px rgba(26, 54, 93, 0.08);
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, var(--ppa-surface) 0%, #edf2f7 100%);
        min-height: 100vh;
      }

      .navbar.ppa-navbar {
        background: var(--ppa-primary) !important;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      }

      .ppa-card {
        border: none;
        border-radius: 0.75rem;
        box-shadow: var(--ppa-card-shadow);
      }

      .ppa-stat-card {
        border: none;
        border-radius: 0.75rem;
        transition: transform 0.15s ease;
      }

      .ppa-stat-card:hover {
        transform: translateY(-2px);
      }

      .ppa-page-title {
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .ppa-auth-card .card-title {
        font-weight: 600;
        color: var(--ppa-primary);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
